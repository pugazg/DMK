name: Generate Five Years Markdown

on:
  pull_request:
    branches:
      - main
    paths:
      - '*.txt'
      - SOURCE_FILES_FIVE_YEARS.txt
      - scripts/split_five_years.py
      - .github/workflows/generate-five-years-md.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Assemble complete publication source
        run: |
          test -s SOURCE_FILES_FIVE_YEARS.txt
          tmp_file="$(mktemp)"
          while IFS= read -r source_file; do
            test -n "$source_file" || continue
            test -f "$source_file"
            printf '\n\n' >> "$tmp_file"
            cat "$source_file" >> "$tmp_file"
          done < SOURCE_FILES_FIVE_YEARS.txt
          mv "$tmp_file" Five_years.txt

      - name: Generate Markdown files
        run: python3 scripts/split_five_years.py

      - name: Validate generated files
        run: |
          test "$(find five-years -type f -name '*.md' | wc -l)" -eq 46
          test -f five-years/README.md
          test "$(find five-years/01-ஆளுமைகளின்-பார்வையில் -type f -name '*.md' | wc -l)" -eq 14
          test "$(find five-years/02-துறை-வாரியாக-சாதனைகள் -type f -name '*.md' | wc -l)" -eq 31
          git diff --check

      - name: Commit generated files
        run: |
          if git diff --quiet -- five-years; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add five-years
          git commit -m "Generate five-year index Markdown files"
          git push
