name: Generate Five Years Markdown

on:
  pull_request:
    branches:
      - main
    paths:
      - Five_years.txt
      - scripts/split_five_years.py
      - .github/workflows/generate-five-years-md.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Generate Markdown files
        run: python3 scripts/split_five_years.py

      - name: Validate generated files
        run: |
          test "$(find five-years -type f -name '*.md' | wc -l)" -eq 46
          test -f five-years/README.md
          git diff --check

      - name: Commit generated files
        run: |
          if git diff --quiet -- five-years; then
            echo "Generated files are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add five-years
          git commit -m "Generate five-year index Markdown files"
          git push
